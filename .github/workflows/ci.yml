name: CI

# Runs on pull requests and on demand (Actions → CI → Run workflow).
on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pdtest
          POSTGRES_PASSWORD: pdtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pdtest" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://pdtest:pdtest@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Sample contract artifacts are reproducible
        run: pnpm --filter @palletdock/contracts check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web production build
        run: pnpm --filter @palletdock/web build

  e2e-fixture:
    # Browser E2E against the isolated fixture stack (local Hardhat chain, not Portaldot).
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @palletdock/web exec playwright install --with-deps chrome
      - name: Start fixture stack
        run: |
          nohup pnpm e2e:stack > e2e-stack.log 2>&1 &
          for i in $(seq 1 120); do test -f .data/e2e/state.json && break; sleep 3; done
          test -f .data/e2e/state.json || (cat e2e-stack.log; exit 1)
      - run: pnpm e2e:fixture
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-stack.log
            .data/e2e/*.log
            apps/web/test-results
