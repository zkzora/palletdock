services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: palletdock
      POSTGRES_PASSWORD: palletdock_dev_only
      POSTGRES_DB: palletdock
    ports:
      - "55432:5432"
    volumes:
      - palletdock-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palletdock -d palletdock"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  palletdock-postgres:
